<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gizaresult</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .cards {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            flex: 1;
            min-width: 350px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.8em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        .result-area {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
            max-height: 500px;
            overflow-y: auto;
        }

        .invoice {
            background: white;
            border: 2px solid #667eea;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .invoice h3 {
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }

        .invoice h4 {
            color: #555;
            margin: 15px 0 10px 0;
        }

        .invoice-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .success {
            color: #28a745;
            font-weight: bold;
        }

        .error {
            color: #dc3545;
            font-weight: bold;
        }

        .warning {
            color: #ff9800;
            font-weight: bold;
        }

        .subject-failed {
            color: #dc3545;
            background: #ffe6e6;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .subject-passed {
            color: #28a745;
        }

        .main-subject {
            background: #e8f0fe;
        }

        .secondary-subject {
            background: #fef9e8;
        }

        .raw-data {
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-main {
            background: #667eea;
            color: white;
        }

        .badge-secondary {
            background: #ff9800;
            color: white;
        }

        @media (max-width: 768px) {
            .cards {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>gizaresult</h1>
        <div class="cards">
            <!-- قسم الدفع -->
            <div class="card">
                <h2>💰 الدفع للاستعلام</h2>
                <form id="payForm">
                    <div class="form-group">
                        <label>الرقم القومي</label>
                        <input type="text" id="nationalIdPay" placeholder="أدخل الرقم القومي" required>
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" id="phonePay" placeholder="أدخل رقم الهاتف" required>
                    </div>
                    <button type="submit">دفع واستعلام</button>
                </form>
                <div id="payResult" class="result-area"></div>
            </div>

            <!-- قسم الاستعلام عن النتيجة -->
            <div class="card">
                <h2>🔍 استعلام عن النتيجة</h2>
                <form id="queryForm">
                    <div class="form-group">
                        <label>الرقم القومي</label>
                        <input type="text" id="nationalIdQuery" placeholder="أدخل الرقم القومي" required>
                    </div>
                    <button type="submit">استعلام</button>
                </form>
                <div id="queryResult" class="result-area"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // قسم الدفع
        document.getElementById('payForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nationalId = document.getElementById('nationalIdPay').value;
            const phone = document.getElementById('phonePay').value;
            const resultDiv = document.getElementById('payResult');

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<p>⏳ جاري الاتصال بالخادم...</p>';

            try {
                const response = await fetch(`${API_BASE}/api/pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nationalId, phone })
                });
                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="invoice">
                            <h3>🧾 فاتورة الدفع</h3>
                            <div class="invoice-item"><strong>📇 الرقم القومي:</strong> ${data.nationalId}</div>
                            <div class="invoice-item"><strong>📞 رقم الهاتف:</strong> ${data.phone}</div>
                            <div class="invoice-item"><strong>🔑 كود فوري:</strong> <span class="success">${data.fawryCode}</span></div>
                            <div class="invoice-item"><strong>⏰ الصلاحية:</strong> ${data.validity}</div>
                            <div class="invoice-item success"><strong>✅ الحالة:</strong> ${data.message}</div>
                        </div>
                        ${data.rawApiResponse ? `
                        <div class="raw-data">
                            <strong>📡 الرد الأصلي من الخادم:</strong><br>
                            <pre>${JSON.stringify(data.rawApiResponse, null, 2)}</pre>
                        </div>
                        ` : ''}
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ ${data.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ حدث خطأ: ${error.message}</div>`;
            }
        });

        // قسم الاستعلام عن النتيجة
        document.getElementById('queryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nationalId = document.getElementById('nationalIdQuery').value;
            const resultDiv = document.getElementById('queryResult');

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<p>⏳ جاري جلب النتيجة...</p>';

            try {
                const response = await fetch(`${API_BASE}/api/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nationalId })
                });
                const data = await response.json();

                if (data.success) {
                    let mainSubjectsHtml = '';
                    let secondarySubjectsHtml = '';
                    
                    // عرض المواد المضافة للمجموع
                    if (data.mainSubjects && data.mainSubjects.length > 0) {
                        mainSubjectsHtml = '<h4>📖 المواد المضافة للمجموع</h4>';
                        data.mainSubjects.forEach(sub => {
                            mainSubjectsHtml += `
                                <div class="invoice-item ${sub.failed ? 'subject-failed' : 'subject-passed'}">
                                    <span><strong>${sub.name}</strong></span>
                                    <span>${sub.score} / ${sub.total} (النجاح: ${sub.pass}) ${sub.failed ? '❌ ملحق' : '✅ نجاح'}</span>
                                </div>
                            `;
                        });
                        mainSubjectsHtml += `
                            <div class="invoice-item success">
                                <strong>📊 المجموع الكلي:</strong>
                                <span>${data.totalScore} / ${data.totalPossible} (${data.totalPercentage}%)</span>
                            </div>
                        `;
                    }
                    
                    // عرض المواد غير المضافة للمجموع
                    if (data.secondarySubjects && data.secondarySubjects.length > 0) {
                        secondarySubjectsHtml = '<h4>📖 المواد غير المضافة للمجموع (نجاح/رسوب فقط)</h4>';
                        data.secondarySubjects.forEach(sub => {
                            secondarySubjectsHtml += `
                                <div class="invoice-item ${sub.failed ? 'subject-failed' : 'subject-passed'}">
                                    <span><strong>${sub.name}</strong></span>
                                    <span>${sub.score} / ${sub.total} (النجاح: ${sub.pass}) ${sub.failed ? '❌ ملحق' : '✅ نجاح'}</span>
                                </div>
                            `;
                        });
                    }
                    
                    // تحذير المواد الملحق غير المضافة للمجموع
                    let secondaryWarning = '';
                    if (data.secondaryFailed && data.secondaryFailed.length > 0) {
                        secondaryWarning = `
                            <div class="invoice-item warning">
                                <strong>⚠️ ملاحظة:</strong>
                                <span>يوجد مواد ملحق (غير مضافة للمجموع): ${data.secondaryFailed.map(s => s.name).join(', ')}</span>
                            </div>
                        `;
                    }
                    
                    resultDiv.innerHTML = `
                        <div class="invoice">
                            <h3>📊 نتيجة الطالب</h3>
                            <div class="invoice-item"><strong>📇 الرقم القومي:</strong> ${data.nationalId}</div>
                            <div class="invoice-item"><strong>📞 رقم الهاتف:</strong> ${data.phone}</div>
                            <div class="invoice-item"><strong>🔑 كود فوري:</strong> ${data.fawryCode}</div>
                            <div class="invoice-item ${data.hasFailed ? 'warning' : 'success'}">
                                <strong>🎓 الحالة العامة:</strong>
                                <span>${data.overallStatus}</span>
                            </div>
                            ${mainSubjectsHtml}
                            ${secondarySubjectsHtml}
                            ${secondaryWarning}
                        </div>
                        ${data.rawApiData ? `
                        <div class="raw-data">
                            <strong>📡 الرد الأصلي من خادم النتائج:</strong><br>
                            <pre>${JSON.stringify(data.rawApiData, null, 2)}</pre>
                            <small class="${data.apiSuccess ? 'success' : 'warning'}">${data.message}</small>
                        </div>
                        ` : ''}
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ ${data.error}<br><small>${data.details || ''}</small></div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ حدث خطأ: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>

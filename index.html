<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gizaresult</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .sections {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 40px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            transition: transform 0.3s;
        }

        .section:hover {
            transform: translateY(-5px);
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        @media (max-width: 768px) {
            .sections {
                grid-template-columns: 1fr;
                padding: 20px;
            }
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>gizaresult</h1>
            <p>وزارة التربية والتعليم</p>
        </div>
        <div class="sections">
            <!-- قسم الدفع -->
            <div class="section">
                <h2>💰 الدفع للاستعلام عن النتيجة</h2>
                <form id="paymentForm">
                    <div class="form-group">
                        <label>الرقم القومي</label>
                        <input type="text" id="nationalIdPay" placeholder="أدخل الرقم القومي" required>
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" id="phonePay" placeholder="أدخل رقم الهاتف" required>
                    </div>
                    <button type="submit">دفع وتوليد الفاتورة</button>
                </form>
                <div id="paymentLoading" class="loading">
                    <div class="spinner"></div>
                    <p>جاري معالجة الدفع...</p>
                </div>
            </div>

            <!-- قسم الاستعلام -->
            <div class="section">
                <h2>🔍 استعلام عن النتيجة</h2>
                <form id="queryForm">
                    <div class="form-group">
                        <label>الرقم القومي</label>
                        <input type="text" id="nationalIdQuery" placeholder="أدخل الرقم القومي" required>
                    </div>
                    <button type="submit">استعلام عن النتيجة</button>
                </form>
                <div id="queryLoading" class="loading">
                    <div class="spinner"></div>
                    <p>جاري الاستعلام...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // معالجة دفع الفاتورة
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nationalId = document.getElementById('nationalIdPay').value;
            const phone = document.getElementById('phonePay').value;

            document.getElementById('paymentLoading').style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/api/create-invoice`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nationalId, phone })
                });

                const data = await response.json();
                if (data.success) {
                    window.location.href = `/pay.html?invoice=${data.invoiceId}`;
                } else {
                    alert('حدث خطأ: ' + data.message);
                }
            } catch (error) {
                alert('خطأ في الاتصال بالخادم');
            } finally {
                document.getElementById('paymentLoading').style.display = 'none';
            }
        });

        // معالجة الاستعلام عن النتيجة
        document.getElementById('queryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nationalId = document.getElementById('nationalIdQuery').value;

            document.getElementById('queryLoading').style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/api/query-result`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nationalId })
                });

                const data = await response.json();
                if (data.success) {
                    window.location.href = `/result.html?id=${data.invoiceId}`;
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('خطأ في الاتصال بالخادم');
            } finally {
                document.getElementById('queryLoading').style.display = 'none';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة النتائج</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma;
}

body{
background:#f3f4f6;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:1000px;
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h2{
margin-bottom:20px;
text-align:center;
}

input{
width:100%;
padding:15px;
margin-bottom:15px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#2563eb;
color:#fff;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

@media(max-width:768px){
.container{
grid-template-columns:1fr;
}
}

</style>

</head>
<body>

<div class="container">

<div class="card">

<h2>الدفع للاستعلام عن النتيجة</h2>

<input type="text" id="payNationalId" placeholder="الرقم القومي">
<input type="text" id="payPhone" placeholder="رقم الهاتف">

<button onclick="goToPay()">
الدفع الآن
</button>

</div>

<div class="card">

<h2>استعلام عن النتيجة</h2>

<input type="text" id="resultNationalId" placeholder="الرقم القومي">

<button onclick="getResult()">
عرض النتيجة
</button>

</div>

</div>

<script>

function goToPay(){

const nationalId =
document.getElementById("payNationalId").value;

const phone =
document.getElementById("payPhone").value;

if(!nationalId || !phone){

alert("اكتب البيانات كاملة");
return;

}

window.location.href =
`/pay.html?nationalId=${nationalId}&phone=${phone}`;

}

async function getResult(){

const nationalId =
document.getElementById("resultNationalId").value;

if(!nationalId){

alert("اكتب الرقم القومي");
return;

}

try{

const res = await fetch("/api/result",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
nationalId
})

});

const data = await res.json();

if(data.error){

alert(data.error);
return;

}

localStorage.setItem(
"studentResult",
JSON.stringify(data)
);

window.location.href="/pay.html?result=1";

}catch(err){

alert("السيرفر لا يعمل");

}

}

</script>

</body>
</html>

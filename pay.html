<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة الدفع - gizaresult</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .invoice-container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .invoice-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .invoice-details {
            margin-bottom: 30px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .row .label {
            font-weight: bold;
            color: #555;
        }

        .row .value {
            color: #333;
        }

        .status {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
            transition: opacity 0.3s;
            border: none;
            cursor: pointer;
        }

        .back-btn:hover {
            opacity: 0.9;
        }

        .fawry-code {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2em;
            letter-spacing: 2px;
            font-weight: bold;
            color: #667eea;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="invoice-container">
        <h1>🧾 فاتورة الدفع</h1>
        <div class="invoice-header">
            <h3>نظام الاستعلام عن النتيجة - gizaresult</h3>
        </div>
        <div id="invoiceContent">
            <div class="invoice-details">
                <div class="row">
                    <span class="label">📇 الرقم القومي:</span>
                    <span class="value" id="displayNationalId">-</span>
                </div>
                <div class="row">
                    <span class="label">📞 رقم الهاتف:</span>
                    <span class="value" id="displayPhone">-</span>
                </div>
                <div class="row">
                    <span class="label">🔑 كود فوري:</span>
                    <span class="value fawry-code" id="displayFawryCode">-</span>
                </div>
                <div class="row">
                    <span class="label">⏰ الصلاحية:</span>
                    <span class="value" id="displayValidity">-</span>
                </div>
            </div>
            <div class="status">
                ✅ تم إنشاء الفاتورة بنجاح
            </div>
        </div>
        <button onclick="window.location.href='/'" class="back-btn">🏠 العودة للرئيسية</button>
    </div>

    <script>
        // قراءة البيانات من Query Parameters
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            
            const nationalId = urlParams.get('nationalId');
            const phone = urlParams.get('phone');
            const fawryCode = urlParams.get('fawryCode');
            const validity = urlParams.get('validity');

            if (nationalId) document.getElementById('displayNationalId').textContent = decodeURIComponent(nationalId);
            if (phone) document.getElementById('displayPhone').textContent = decodeURIComponent(phone);
            if (fawryCode) document.getElementById('displayFawryCode').textContent = decodeURIComponent(fawryCode);
            if (validity) document.getElementById('displayValidity').textContent = decodeURIComponent(validity);

            // إذا لم توجد بيانات، نرجع للرئيسية
            if (!nationalId) {
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .invoice-container {
            max-width: 800px;
            margin: 0 auto;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .invoice {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .invoice-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .invoice-header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .invoice-body {
            padding: 40px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #eee;
            margin-bottom: 10px;
        }

        .info-label {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }

        .info-value {
            color: #333;
            font-size: 1.1em;
        }

        .payment-code {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .code {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 5px;
            font-family: monospace;
            background: white;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            margin: 10px 0;
        }

        .status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
        }

        .status-pending {
            background: #ffc107;
            color: #333;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        button:hover {
            transform: scale(1.02);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="invoice-container">
        <div class="invoice">
            <div class="invoice-header">
                <h1>🧾 فاتورة الدفع</h1>
                <p>الرجاء إتمام عملية الدفع</p>
            </div>
            <div class="invoice-body" id="invoiceBody">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>جاري تحميل بيانات الفاتورة...</p>
                </div>
                <div id="invoiceContent" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const invoiceId = urlParams.get('invoice');

        async function loadInvoice() {
            if (!invoiceId) {
                alert('رقم الفاتورة غير صالح');
                window.location.href = '/';
                return;
            }

            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch(`${window.location.origin}/api/get-invoice/${invoiceId}`);
                const data = await response.json();

                if (data.success) {
                    displayInvoice(data.invoice);
                } else {
                    alert('لم يتم العثور على الفاتورة');
                    window.location.href = '/';
                }
            } catch (error) {
                alert('خطأ في تحميل البيانات');
                window.location.href = '/';
            }
        }

        function displayInvoice(invoice) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('invoiceContent').style.display = 'block';

            const content = `
                <div class="info-row">
                    <span class="info-label">📄 رقم الفاتورة:</span>
                    <span class="info-value">${invoice.id}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">🆔 الرقم القومي:</span>
                    <span class="info-value">${invoice.nationalId}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">📞 رقم الهاتف:</span>
                    <span class="info-value">${invoice.phone}</span>
                </div>
                <div class="payment-code">
                    <div class="info-label">🔑 كود فوري</div>
                    <div class="code">${invoice.fawryCode}</div>
                    <p style="margin-top: 10px; color: #666;">استخدم هذا الكود للدفع عبر فوري</p>
                </div>
                <div class="info-row">
                    <span class="info-label">✅ الصلاحية:</span>
                    <span class="info-value"><span class="status status-pending">قيد الانتظار</span></span>
                </div>
                <div class="info-row">
                    <span class="info-label">💰 المبلغ:</span>
                    <span class="info-value">50 جنيه مصري</span>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="checkPayment()">التحقق من الدفع</button>
                    <button class="btn-secondary" onclick="window.location.href='/'">الرجوع للرئيسية</button>
                </div>
            `;

            document.getElementById('invoiceContent').innerHTML = content;
        }

        async function checkPayment() {
            document.getElementById('loading').style.display = 'block';
            
            try {
                const response = await fetch(`${window.location.origin}/api/check-payment/${invoiceId}`);
                const data = await response.json();

                if (data.paid) {
                    alert('تم الدفع بنجاح! سيتم تحويلك لصفحة النتيجة');
                    window.location.href = `/result.html?id=${invoiceId}`;
                } else {
                    alert('لم يتم الدفع بعد. الرجاء الدفع عبر كود فوري');
                }
            } catch (error) {
                alert('حدث خطأ في التحقق من الدفع');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        loadInvoice();
    </script>
</body>
</html>
